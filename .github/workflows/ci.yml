name: Backend CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Bauen und testen
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log

      - name: Fehler als Annotation ausgeben
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              msg=$(head -c 6000 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$(basename "$f")::$msg"
            fi
          done
          msg=$(grep -E "ERROR|FAIL" build.log | head -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=build.log::$msg"

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-backend
          path: target/*.jar
