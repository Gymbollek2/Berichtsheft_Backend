spring.application.name=berichtsheft-backend

# ---------------------------------------------------------------------------
# HTTPS – die Anwendung ist ausschliesslich verschluesselt erreichbar: https://localhost:8443
# Lokal wird beim ersten Start ein selbstsigniertes Zertifikat unter ./data/ssl erzeugt.
# Produktion: SSL_KEYSTORE (z. B. file:/etc/berichtsheft/server.p12) und SSL_KEYSTORE_PASSWORD setzen.
# ---------------------------------------------------------------------------
server.port=${PORT:8443}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:file:./data/ssl/berichtsheft-dev.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:berichtsheft-dev}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# ---------------------------------------------------------------------------
# Datenbank: H2 als Datei unter ./data (wird beim ersten Start angelegt).
# Fuer eine leere Datenbank einfach den Ordner ./data loeschen.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/berichtsheft;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2-Weboberflaeche: https://localhost:8443/h2-console  (JDBC-URL siehe oben, User "sa", kein Passwort)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Sicherheit
# JWT_SECRET MUSS ausserhalb der lokalen Entwicklung per Umgebungsvariable gesetzt werden.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:lokaler-entwicklungs-schluessel-bitte-in-produktion-ersetzen}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.cors.allowed-origins=${CORS_ORIGINS:https://localhost:4200}

# Legt beim ersten Start Demo-Benutzer, Lernziele und Berichtsheft-Eintraege an.
app.demo-data.enabled=${DEMO_DATA:true}

# CSV-Import
spring.servlet.multipart.max-file-size=2MB
