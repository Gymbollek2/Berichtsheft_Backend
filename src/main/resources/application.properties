spring.application.name=berichtsheft-backend

# ---------------------------------------------------------------------------
# HTTPS – die Anwendung ist ausschliesslich verschluesselt erreichbar: https://localhost:5016
# Lokal wird beim ersten Start ein selbstsigniertes Zertifikat unter ./data/ssl erzeugt.
# Produktion: SSL_KEYSTORE (z. B. file:/etc/berichtsheft/server.p12) und SSL_KEYSTORE_PASSWORD setzen.
# ---------------------------------------------------------------------------
server.port=${PORT:5016}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:file:./data/ssl/berichtsheft-dev.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:berichtsheft-dev}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# ---------------------------------------------------------------------------
# Datenbank: H2 als Datei unter ./data (wird beim ersten Start angelegt).
# Fuer eine leere Datenbank einfach den Ordner ./data loeschen.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/berichtsheft;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2-Weboberflaeche: https://localhost:5016/h2-console  (JDBC-URL siehe oben, User "sa", kein Passwort)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Sicherheit
# JWT_SECRET MUSS ausserhalb der lokalen Entwicklung per Umgebungsvariable gesetzt werden.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:lokaler-entwicklungs-schluessel-bitte-in-produktion-ersetzen}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.cors.allowed-origins=${CORS_ORIGINS:https://localhost:4200}

# Windows-Anmeldung (Single Sign-on): Der Browser meldet den Windows-Benutzer automatisch an (Kerberos/NTLM).
# Zugriff hat nur, wessen Windows-Anmeldename als Benutzername in der Personenliste steht.
# Voraussetzung: Server ist Mitglied der Domaene (siehe deploy/SERVER-ANLEITUNG.md).
app.sso.enabled=${SSO_ENABLED:true}
# Optional nur bestimmte Domaenen zulassen (Kurzname, kommagetrennt), z. B. SSO_DOMAINS=FIRMA
app.sso.domains=${SSO_DOMAINS:}
# Anmeldung mit Benutzername und Passwort zusaetzlich erlauben (z. B. fuer Rechner ausserhalb der Domaene)
app.password-login.enabled=${PASSWORT_LOGIN:true}
# Kerberos-Tickets enthalten alle AD-Gruppen des Benutzers und werden leicht 10-40 KB gross. Mit dem
# Tomcat-Standard (8 KB) wird die Anmeldung per Servername dann mit HTTP 400 abgewiesen (per IP klappt es,
# weil der Browser dort NTLM mit kleinen Tokens nimmt). 64 KB entspricht dem, was Microsoft fuer IIS empfiehlt.
server.max-http-request-header-size=${MAX_HEADER_SIZE:64KB}

# Legt beim ersten Start Demo-Benutzer, Lernziele und Berichtsheft-Eintraege an.
app.demo-data.enabled=${DEMO_DATA:true}

# Spielt einmalig die Richt- und Groblernziele des Ausbildungsrahmenplans Fachinformatiker/in
# Anwendungsentwicklung (FIAusbV 2020) mit je einem Beispiel-Feinlernziel ein (lernziele/rahmenplan-fiae.csv).
app.rahmenplan-import.enabled=${RAHMENPLAN_IMPORT:true}

# ---------------------------------------------------------------------------
# Frontend: Das gebaute Angular-Frontend (dist/azubi-portal/browser) liegt im Ordner ./frontend
# und wird unter derselben Adresse wie die API ausgeliefert. Lokal mit "ng serve" bleibt der Ordner leer.
# ---------------------------------------------------------------------------
spring.web.resources.static-locations=${FRONTEND_DIR:file:./frontend/},classpath:/static/

# CSV-Import
spring.servlet.multipart.max-file-size=2MB

# ---------------------------------------------------------------------------
# E-Mail-Versand (SMTP)
# Lokal: Mailhog (SMTP auf Port 1025, Weboberflaeche http://localhost:8025) – ohne Anmeldung und ohne TLS.
# Alle Werte lassen sich per Umgebungsvariable ueberschreiben, z. B. MAIL_HOST=smtp.firma.de MAIL_PORT=587
# MAIL_USERNAME=... MAIL_PASSWORD=... MAIL_SMTP_AUTH=true MAIL_STARTTLS=true
# ---------------------------------------------------------------------------
# Hauptschalter: false = es werden keine E-Mails verschickt (die Glocke im Portal funktioniert weiter)
app.mail.enabled=${MAIL_ENABLED:true}

# Versandweg:
#   smtp  = ueber den SMTP-Server unten (lokal Mailhog, oder ein eigener Exchange-Server)
#   graph = ueber Microsoft 365 per Microsoft Graph mit OAuth2-Anmeldung (Abschnitt "Microsoft Graph" unten)
app.mail.versandart=${MAIL_VERSANDART:smtp}

# SMTP-Server (nur bei app.mail.versandart=smtp)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# "smtp" oder "smtps" (SMTP direkt ueber SSL/TLS, meist Port 465)
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=UTF-8
# Anmeldung am SMTP-Server (true, sobald Benutzername/Passwort gesetzt sind)
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
# STARTTLS (meist Port 587): enable = verwenden, wenn der Server es anbietet; required = sonst abbrechen
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
# SSL/TLS von Anfang an (Alternative zu protocol=smtps)
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
# Hosts, deren Zertifikat ohne Pruefung vertraut wird ("*" = alle, nur fuer interne Server mit eigenem Zertifikat)
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${MAIL_SSL_CHECK_SERVER_IDENTITY:true}
# Zeitlimits in Millisekunden, damit ein haengender Mailserver die Anwendung nicht blockiert
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}
# Name, mit dem sich die Anwendung beim Server meldet (EHLO); leer = Rechnername
spring.mail.properties.mail.smtp.localhost=${MAIL_EHLO_NAME:}
# Beim Start pruefen, ob der Mailserver erreichbar ist (bricht den Start ab, wenn nicht)
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

# Microsoft Graph (nur bei app.mail.versandart=graph) – Einrichtung siehe deploy/SERVER-ANLEITUNG.md.
# Die Anwendung meldet sich mit einer App-Registrierung aus Microsoft Entra ID an (OAuth2, Client-Credentials),
# es wird kein Benutzerpasswort gebraucht. Das Client-Secret NUR per Umgebungsvariable setzen, nie hier eintragen.
# Verzeichnis-ID (Mandanten-ID, GUID) oder die Domain des Mandanten
app.mail.graph.tenant-id=${MAIL_GRAPH_TENANT_ID:}
# Anwendungs-ID (Client-ID) der App-Registrierung
app.mail.graph.client-id=${MAIL_GRAPH_CLIENT_ID:}
# Geheimer Clientschluessel ("Wert", nicht die "Geheime ID") der App-Registrierung
app.mail.graph.client-secret=${MAIL_GRAPH_CLIENT_SECRET:}
# Postfach, aus dem gesendet wird (leer = Absenderadresse app.mail.absender). Der Anzeigename kommt bei Graph
# aus dem Postfach selbst, app.mail.absender-name wird dort nicht verwendet.
app.mail.graph.postfach=${MAIL_GRAPH_POSTFACH:}
# Kopie im Ordner "Gesendete Elemente" des Postfachs ablegen
app.mail.graph.im-gesendet-speichern=${MAIL_GRAPH_GESENDET_SPEICHERN:true}
# Nur fuer andere Microsoft-Clouds aendern (z. B. US Government)
app.mail.graph.login-url=${MAIL_GRAPH_LOGIN_URL:https://login.microsoftonline.com}
app.mail.graph.api-url=${MAIL_GRAPH_API_URL:https://graph.microsoft.com/v1.0}
app.mail.graph.scope=${MAIL_GRAPH_SCOPE:https://graph.microsoft.com/.default}
# Zeitlimit je Anfrage an Microsoft in Millisekunden
app.mail.graph.timeout-ms=${MAIL_GRAPH_TIMEOUT:15000}

# Absender
app.mail.absender=${MAIL_ABSENDER:Ausbildung-Fellbach@AzubiPortal.de}
app.mail.absender-name=${MAIL_ABSENDER_NAME:Azubi Portal}
# Optionale Antwortadresse (leer = Antworten gehen an den Absender)
app.mail.antwort-an=${MAIL_ANTWORT_AN:}
# Betreff-Praefix, z. B. "[Azubi Portal]" (leer = ohne)
app.mail.betreff-praefix=${MAIL_BETREFF_PRAEFIX:[Azubi Portal]}

# Empfaenger: Die Adresse wird aus dem Namen der Person gebildet. Platzhalter: {vorname}, {nachname}, {benutzername}.
# Umlaute werden umgeschrieben (Jürgen Weiß -> Juergen.Weiss@Azubi.de), Leerzeichen werden zu Bindestrichen.
app.mail.empfaenger.muster-azubi=${MAIL_MUSTER_AZUBI:{vorname}.{nachname}@Azubi.de}
app.mail.empfaenger.muster-ausbilder=${MAIL_MUSTER_AUSBILDER:{vorname}.{nachname}@Azubi.de}
# true = Adresse komplett kleinschreiben (vorname.nachname@azubi.de)
app.mail.empfaenger.kleinschreibung=${MAIL_KLEINSCHREIBUNG:false}
# Zum Testen: alle E-Mails an diese eine Adresse umleiten (leer = an die echten Empfaenger)
app.mail.empfaenger.umleiten-an=${MAIL_UMLEITEN_AN:}

# Adresse des Portals fuer die Buttons in den E-Mails (lokal: "ng serve" auf Port 4200)
app.mail.portal-url=${MAIL_PORTAL_URL:https://localhost:4200}

# Automatische Erinnerungen per E-Mail: taeglich um 7:30 Uhr und einmal nach dem Start
app.mail.erinnerung.enabled=${MAIL_ERINNERUNG:true}
app.mail.erinnerung.cron=${MAIL_ERINNERUNG_CRON:0 30 7 * * *}
# Azubi: Woche ist so viele Tage nach ihrem Freitag noch nicht abgegeben
app.mail.erinnerung.tage-bis-abgabe=${MAIL_TAGE_BIS_ABGABE:7}
# Ausbilder: abgegebene Woche ist so viele Tage nach der Abgabe noch nicht abgenommen/zurueckgegeben
app.mail.erinnerung.tage-bis-abnahme=${MAIL_TAGE_BIS_ABNAHME:7}
# Azubi: nur Wochen der letzten X Wochen anmahnen (verhindert eine Mailflut fuer alte Daten)
app.mail.erinnerung.max-wochen-zurueck=${MAIL_MAX_WOCHEN_ZURUECK:8}
