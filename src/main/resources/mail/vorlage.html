<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <title>{{betreff}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f8;-webkit-text-size-adjust:100%;">
<!-- Vorschautext im Posteingang -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{vorschau}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f8;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e4e3ec;border-radius:10px;overflow:hidden;">
                <!-- Farbverlauf wie im Portal -->
                <tr>
                    <td height="6" style="height:6px;line-height:6px;font-size:0;background-color:#dd00a0;background-image:linear-gradient(90deg,#ffc400 0%,#ee0000 35%,#dd00a0 70%,#7a2bd6 100%);">&nbsp;</td>
                </tr>
                <tr>
                    <td style="background-color:#010046;padding:20px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-size:18px;font-weight:600;color:#ffffff;letter-spacing:0.2px;">
                        Azubi Portal <span style="font-weight:400;color:#cfcde0;">&middot; Digitales Berichtsheft</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 32px 8px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;">
                        {{status}}
                        <h1 style="margin:0 0 20px 0;font-size:22px;line-height:30px;font-weight:600;color:#010046;">{{ueberschrift}}</h1>
                        {{inhalt}}
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 32px 32px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;">
                        {{button}}
                        <p style="margin:24px 0 0 0;font-size:15px;line-height:24px;color:#1d1b3a;">Viele Grüße<br>dein Azubi Portal</p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f5f5f8;border-top:1px solid #e4e3ec;padding:16px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-size:12px;line-height:18px;color:#5d5b74;">
                        Diese E-Mail wurde automatisch vom Azubi Portal verschickt.
                        {{linkHinweis}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
