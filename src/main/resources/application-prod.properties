# ---------------------------------------------------------------------------
# Serverbetrieb (Profil "prod"): java -jar berichtsheft.jar --spring.profiles.active=prod
# Ergaenzt/ueberschreibt application.properties. Der Windows-Dienst (deploy/) setzt die
# Umgebungsvariablen JWT_SECRET, PORT, SSL_* usw. in berichtsheft-service.xml.
# ---------------------------------------------------------------------------

# Ohne eigenes JWT_SECRET startet der Server nicht (Tokens waeren sonst faelschbar).
app.jwt.require-secret=true

# Keine Demo-Benutzer auf dem Server – der erste Ausbilder wird vom Installationsskript angelegt.
# Zum Ausprobieren: Umgebungsvariable DEMO_DATA=true.
app.demo-data.enabled=${DEMO_DATA:false}

# Datenbank-Weboberflaeche auf dem Server abschalten.
spring.h2.console.enabled=false

# Das Frontend wird vom Backend ausgeliefert (gleiche Adresse) – CORS wird nur noch fuer
# abweichende Adressen gebraucht, z. B. CORS_ORIGINS=https://andere-adresse:4200
app.cors.allowed-origins=${CORS_ORIGINS:https://localhost}

# Logdatei neben der Anwendung (ältere Dateien werden automatisch rotiert)
logging.file.name=${LOG_FILE:logs/berichtsheft.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Fehlermeldungen ohne interne Details
server.error.include-stacktrace=never
server.error.include-message=never

# Komprimierung fuer Frontend-Dateien und JSON
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
